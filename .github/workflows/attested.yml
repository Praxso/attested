name: attested

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      break:
        description: "Set ATTESTED_SAMPLE_BREAK=1 so one test fails (red run)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  attestations: write
  checks: write

jobs:
  # Job is named "attested run" so its own check does not collide with the "attested" check run that `attested check` posts.
  run:
    name: attested run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/sample-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build attested
        working-directory: .
        run: pnpm build

      - name: Test attested CLI and MCP server
        working-directory: .
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: attested run
        id: run
        env:
          ATTESTED_SAMPLE_BREAK: ${{ inputs.break && '1' || '' }}
        run: pnpm exec attested run --expect-sha "$GITHUB_SHA" -- pnpm exec playwright test

      - name: attested attest
        id: prepare
        if: ${{ !cancelled() }}
        run: pnpm exec attested attest

      # Forked pull requests get no OIDC token, so they cannot be signed; `attested verify` reports them as unsigned.
      - name: Sign receipt (actions/attest, custom predicate)
        id: attest
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && !github.event.pull_request.head.repo.fork }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.prepare.outputs.subject-path }}
          predicate-type: ${{ steps.prepare.outputs.predicate-type }}
          predicate-path: ${{ steps.prepare.outputs.predicate-path }}

      - name: Sign in-toto Test Result (dual attestation)
        id: attest-test-result
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && !github.event.pull_request.head.repo.fork }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.prepare.outputs.subject-path }}
          predicate-type: ${{ steps.prepare.outputs.test-result-predicate-type }}
          predicate-path: ${{ steps.prepare.outputs.test-result-predicate-path }}
          show-summary: false

      - name: Upload Playwright artifacts and receipt
        id: upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attested-${{ github.sha }}
          path: |
            examples/sample-app/attested
            examples/sample-app/test-results
          retention-days: 90
          if-no-files-found: error

      - name: Print attestation URL
        if: ${{ !cancelled() && steps.attest.outcome == 'success' }}
        env:
          URL: ${{ steps.attest.outputs.attestation-url }}
          URL2: ${{ steps.attest-test-result.outputs.attestation-url }}
          SHA256: ${{ steps.prepare.outputs.subject-sha256 }}
        run: |
          echo "receipt attestation: $URL"
          echo "test-result attestation: $URL2"
          echo "subject ctrf.json sha256:$SHA256"
          {
            echo "## attested receipt"
            echo "- receipt attestation: $URL"
            echo "- test-result attestation: $URL2"
            echo "- subject \`ctrf.json\` sha256 \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: attested check
        if: ${{ !cancelled() && steps.run.outcome != 'skipped' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: pnpm exec attested check --artifact-url "$ARTIFACT_URL" --artifact-name "attested-$GITHUB_SHA" --attestation-url "$ATTESTATION_URL"
