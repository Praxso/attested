name: attested

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      break:
        description: "Set ATTESTED_SAMPLE_BREAK=1 so one test fails (red run)"
        type: boolean
        default: false

# Two jobs so that no PR code ever runs where the signing identity or a write token is available:
# - "attested run" runs the PR's tests with a read-only token and uploads the results as an artifact;
# - "attested sign" runs only attested from the protected base commit, treats the results as data, builds the receipt
#   from the event context, signs it, and posts the "attested" check.
permissions:
  contents: read

jobs:
  # Named "attested run" so its job check does not collide with the "attested" check run.
  run:
    name: attested run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    defaults:
      run:
        working-directory: examples/sample-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build attested
        working-directory: .
        run: pnpm build

      - name: Test attested CLI and MCP server
        working-directory: .
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Runs the PR's tests through the PR's own build of attested (the code under test in this repository). Its
      # receipt is informational; the sign job rebuilds the receipt from the raw results.
      - name: attested run
        id: run
        env:
          ATTESTED_SAMPLE_BREAK: ${{ inputs.break && '1' || '' }}
        run: pnpm exec attested run --expect-sha "$GITHUB_SHA" -- pnpm exec playwright test

      # Name must not start with "attested-": verify/required.sh takes the first artifact with that prefix as the receipt.
      - name: Upload test results (evidence)
        id: upload
        if: ${{ !cancelled() && steps.run.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ github.sha }}
          path: |
            examples/sample-app/attested/ctrf.json
            examples/sample-app/test-results
            examples/sample-app/playwright.config.ts
          retention-days: 90
          if-no-files-found: error

  sign:
    name: attested sign
    needs: run
    if: ${{ !cancelled() && (needs.run.result == 'success' || needs.run.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      checks: write
    steps:
      # Never the PR head or merge commit: on pull_request the base commit, on push the pushed commit.
      - name: Check out attested at the protected base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No dependency cache: the PR's test job can write the pnpm cache for this ref.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build attested (base commit)
        run: pnpm install --frozen-lockfile --filter @praxso/attested && pnpm --filter @praxso/attested build

      - name: Download test results (data only)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: results-${{ github.sha }}
          path: results

      - name: attested attest --from-results
        id: prepare
        run: node packages/cli/bin/attested.js attest --from-results results --out signed/attested --rerun "pnpm exec attested run -- pnpm exec playwright test"

      # Forked pull requests get no OIDC token, so they cannot be signed; `attested verify` reports them as unsigned.
      - name: Sign receipt (actions/attest, custom predicate)
        id: attest
        if: ${{ steps.prepare.outcome == 'success' && !github.event.pull_request.head.repo.fork }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.prepare.outputs.subject-path }}
          predicate-type: ${{ steps.prepare.outputs.predicate-type }}
          predicate-path: ${{ steps.prepare.outputs.predicate-path }}

      - name: Sign in-toto Test Result (dual attestation)
        if: ${{ steps.prepare.outcome == 'success' && !github.event.pull_request.head.repo.fork }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.prepare.outputs.subject-path }}
          predicate-type: ${{ steps.prepare.outputs.test-result-predicate-type }}
          predicate-path: ${{ steps.prepare.outputs.test-result-predicate-path }}
          show-summary: false

      # The receipt artifact `attested verify` downloads: attested/{ctrf,receipt,predicate,test-result,packet}.json.
      - name: Upload receipt
        if: ${{ steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attested-${{ github.sha }}
          path: signed
          retention-days: 90
          if-no-files-found: error

      - name: attested check
        if: ${{ steps.prepare.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ needs.run.outputs.artifact-url }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: node packages/cli/bin/attested.js check --receipt signed/attested/receipt.json --packet signed/attested/packet.json --artifact-url "$ARTIFACT_URL" --artifact-name "attested-$GITHUB_SHA" --attestation-url "$ATTESTATION_URL"
